name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # Русский текст в print() иначе падает на cp1252 в консоли раннера.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.0.0"

      - name: Check tag matches version.py
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $ver = python -c "import version; print(version.APP_VERSION)"
          if ($tag -ne $ver) {
            throw "Тег $tag не совпадает с версией в version.py ($ver)"
          }

      - name: Build application (PyInstaller onedir)
        run: python build_exe.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Prepare WebView2 bootstrapper
        shell: pwsh
        run: |
          $dst = Join-Path $PWD "installer\vendor\MicrosoftEdgeWebView2Setup.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $dst
          $sig = Get-AuthenticodeSignature -LiteralPath $dst
          Write-Host "WebView2: $($sig.Status) / $($sig.SignerCertificate.Subject) / $((Get-Item $dst).Length) bytes"
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notlike "*Microsoft Corporation*") {
            throw "WebView2 bootstrapper signature check failed"
          }

      - name: Build installer (without report key)
        run: python build_installer.py --no-key

      - name: Build portable ZIP
        run: python build_portable.py

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path installer_output/YandexDiskBackup-*-setup.exe, dist/YandexDiskBackup-*-portable.zip
          foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $f.FullName).Hash.ToLower()
            "$hash  $($f.Name)" | Out-File -Encoding ascii -NoNewline "$($f.FullName).sha256"
            Write-Host "$($f.Name): $hash"
          }

      - name: Extract release notes from CHANGELOG
        run: python tools/changelog_for_tag.py "${{ github.ref_name }}" release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_output/YandexDiskBackup-*-setup.exe
            installer_output/YandexDiskBackup-*-setup.exe.sha256
            dist/YandexDiskBackup-*-portable.zip
            dist/YandexDiskBackup-*-portable.zip.sha256
          body_path: release_notes.md
          fail_on_unmatched_files: true
